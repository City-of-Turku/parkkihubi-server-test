[pep8]
max-line-length = 120
exclude = *migrations*

[flake8]
exclude = .git,
          *migrations*,
          venv,
          services/models/__init__.py,
          services/utils/__init__.py,
          smbackend/settings_test.py,
		  local_settings.py,
max-line-length = 120
ignore = E203,W503,N813